<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A2463">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>FENIX Eval CF — Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/fenix.css?v=33">
</head>
<body>

  <header class="fenix-header">
    <div class="header-stripe"></div>
    <div class="header-inner">
      <div class="header-logo">
        <img src="assets/logo-fenix.png" alt="Fenix">
      </div>
      <div class="header-text">
        <h1>FENIX Eval CF</h1>
        <p>Dashboard Coach</p>
      </div>
      <div class="header-actions">
        <button class="btn-logout" onclick="logout()">Déconnexion</button>
      </div>
    </div>
  </header>

  <!-- Navigation coach -->
  <nav style="background:var(--white);border-bottom:1px solid var(--gray-200);display:flex;overflow-x:auto;">
    <button class="tab-btn active" onclick="showTab('sessions')" id="tab-sessions">Sessions</button>
    <button class="tab-btn" onclick="showTab('players')" id="tab-players">Joueurs</button>
  </nav>

  <main class="page-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/supabase-client.js?v=32"></script>
  <script src="js/app.js?v=32"></script>
  <script src="js/criteria-data.js?v=32"></script>
  <script src="pages/coach-dashboard.js?v=32"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await requireAuth('coach');
      if (!auth) return;
      await initCoachDashboard(auth.user);
    });

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (tab === 'sessions') renderSessions();
      if (tab === 'players')  renderPlayers();
    }
  </script>

</body>
</html>

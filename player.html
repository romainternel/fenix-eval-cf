<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FENIX CF">
  <meta name="theme-color" content="#0A2463">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo-fenix.png">
  <title>FENIX Eval CF — Joueur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/fenix.css?v=50">
</head>
<body>

  <header class="fenix-header">
    <div class="header-stripe"></div>
    <div class="header-inner">
      <div class="header-logo">
        <img src="assets/logo-fenix.png" alt="Fenix">
      </div>
      <div class="header-text">
        <h1>FENIX Eval CF</h1>
        <p id="playerName">Chargement…</p>
      </div>
      <div class="header-actions">
        <button class="btn-logout" onclick="logout()">Déconnexion</button>
      </div>
    </div>
  </header>

  <nav style="background:var(--white);border-bottom:1px solid var(--gray-200);display:flex;overflow-x:auto;">
    <button class="tab-btn active" onclick="showPlayerTab('sessions')" id="tab-sessions">Mes sessions</button>
    <button class="tab-btn" onclick="showPlayerTab('suivi')" id="tab-suivi">Mon suivi</button>
  </nav>

  <main class="page-content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div></div>
  </main>

  <div class="page-content" id="spSuiviContent" style="display:none"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="js/supabase-client.js?v=32"></script>
  <script src="js/app.js?v=45"></script>
  <script src="js/criteria-data.js?v=33"></script>
  <script src="js/sociopro.js?v=1"></script>
  <script src="pages/player-home.js?v=45"></script>
  <script src="pages/sociopro-player.js?v=1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await requireAuth('joueur');
      if (!auth) return;
      window._spPlayerAuthId = auth.user.id;
      await initPlayerHome(auth.user);
    });
  </script>

</body>
</html>
